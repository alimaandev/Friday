name: Health Check & Heartbeat

on:
  schedule:
    # every 14 minutes ≈ 100 commits/day
    - cron: "*/14 * * * *"
  workflow_dispatch:

concurrency:
  group: heartbeat
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  health:
    name: Health Check
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        env:
          PYTHON_VERSION: "3.11"
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest

      - name: Lint with Ruff
        run: ruff check . --output-format=github

      - name: Run fast health tests
        run: python -m pytest tests/test_main.py tests/test_logger.py tests/test_config.py tests/test_security.py tests/test_registry.py -q

  heartbeat:
    name: Heartbeat Commit
    runs-on: ubuntu-latest
    needs: health
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Append heartbeat entry
        run: |
          if [ ! -f heartbeat.log ]; then touch heartbeat.log; fi
          echo "[$(date -u +'%Y-%m-%dT%H:%M:%SZ')] health=ok" >> heartbeat.log

      - name: Commit and push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add heartbeat.log
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: heartbeat $(date -u +'%Y-%m-%d %H:%M')"
          git push origin main
