<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#06060a"/>
      <stop offset="100%" stop-color="#0a0a14"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00a8ff"/>
      <stop offset="100%" stop-color="#33ccff"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00a8ff" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#7c3aed" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#00a8ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="orbGlow">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="orbBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00a8ff" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#00a8ff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#00a8ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bgGrad)"/>

  <!-- Grid overlay -->
  <g opacity="0.03">
    <line x1="0" y1="80" x2="1280" y2="80" stroke="#00a8ff" stroke-width="0.5"/>
    <line x1="0" y1="160" x2="1280" y2="160" stroke="#00a8ff" stroke-width="0.5"/>
    <line x1="0" y1="240" x2="1280" y2="240" stroke="#00a8ff" stroke-width="0.5"/>
    <line x1="0" y1="320" x2="1280" y2="320" stroke="#00a8ff" stroke-width="0.5"/>
    <line x1="0" y1="400" x2="1280" y2="400" stroke="#00a8ff" stroke-width="0.5"/>
    <line x1="0" y1="480" x2="1280" y2="480" stroke="#00a8ff" stroke-width="0.5"/>
    <line x1="0" y1="560" x2="1280" y2="560" stroke="#00a8ff" stroke-width="0.5"/>
    <line x1="160" y1="0" x2="160" y2="640" stroke="#00a8ff" stroke-width="0.5"/>
    <line x1="320" y1="0" x2="320" y2="640" stroke="#00a8ff" stroke-width="0.5"/>
    <line x1="480" y1="0" x2="480" y2="640" stroke="#00a8ff" stroke-width="0.5"/>
    <line x1="640" y1="0" x2="640" y2="640" stroke="#00a8ff" stroke-width="0.5"/>
    <line x1="800" y1="0" x2="800" y2="640" stroke="#00a8ff" stroke-width="0.5"/>
    <line x1="960" y1="0" x2="960" y2="640" stroke="#00a8ff" stroke-width="0.5"/>
    <line x1="1120" y1="0" x2="1120" y2="640" stroke="#00a8ff" stroke-width="0.5"/>
  </g>

  <!-- Glow orbs in background -->
  <circle cx="350" cy="320" r="250" fill="url(#orbBg)"/>
  <circle cx="900" cy="320" r="200" fill="rgba(124,58,237,0.03)"/>

  <!-- Diagonal accent line -->
  <line x1="0" y1="640" x2="280" y2="0" stroke="url(#glowGrad)" stroke-width="2"/>

  <!-- ===== Left Side: Text ===== -->

  <!-- Logo area -->
  <g filter="url(#glow)">
    <circle cx="80" cy="70" r="18" fill="rgba(0,168,255,0.15)" stroke="#00a8ff" stroke-width="1.5"/>
    <text x="80" y="75" text-anchor="middle" fill="#00a8ff" font-family="system-ui,sans-serif" font-size="16" font-weight="700">F</text>
    <text x="108" y="76" fill="#f0f0f0" font-family="system-ui,sans-serif" font-size="16" font-weight="600">Friday</text>
  </g>

  <!-- Tagline -->
  <text x="80" y="180" fill="#f0f0f0" font-family="system-ui,sans-serif" font-size="48" font-weight="700" letter-spacing="-1.5">Your Desktop AI</text>
  <text x="80" y="232" fill="#f0f0f0" font-family="system-ui,sans-serif" font-size="48" font-weight="700" letter-spacing="-1.5">Command Center</text>

  <text x="82" y="290" fill="#a0a0a8" font-family="system-ui,sans-serif" font-size="18" line-height="1.6">
    <tspan x="82" dy="0">Speak, gesture, or type — your AI runs locally.</tspan>
    <tspan x="82" dy="26">No cloud lock-in. No subscriptions.</tspan>
  </text>

  <!-- Feature list -->
  <g>
    <circle cx="82" cy="370" r="4" fill="#00a8ff"/>
    <text x="96" y="375" fill="#f0f0f0" font-family="system-ui,sans-serif" font-size="15">3D reactive orb with 10 animation states</text>

    <circle cx="82" cy="400" r="4" fill="#00a8ff"/>
    <text x="96" y="405" fill="#f0f0f0" font-family="system-ui,sans-serif" font-size="15">Live intelligence panel — 10 real-time data modules</text>

    <circle cx="82" cy="430" r="4" fill="#00a8ff"/>
    <text x="96" y="435" fill="#f0f0f0" font-family="system-ui,sans-serif" font-size="15">Voice, gesture, and wake-word ("Hey Friday")</text>

    <circle cx="82" cy="460" r="4" fill="#7c3aed"/>
    <text x="96" y="465" fill="#f0f0f0" font-family="system-ui,sans-serif" font-size="15">Google Calendar · Gmail · Streaming Chat</text>
  </g>

  <!-- One command -->
  <rect x="80" y="510" width="460" height="48" rx="10" fill="rgba(0,0,0,0.5)" stroke="rgba(0,168,255,0.2)" stroke-width="1.5"/>
  <text x="96" y="540" fill="#33ccff" font-family="monospace" font-size="18" font-weight="500">docker compose up -d</text>
  <text x="400" y="540" fill="#a0a0a8" font-family="system-ui,sans-serif" font-size="11">→ localhost:5173</text>

  <!-- Tech stack badges -->
  <g>
    <rect x="80" y="575" height="26" rx="6" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="94" y="593" fill="#a0a0a8" font-family="system-ui,sans-serif" font-size="12">React 19</text>

    <rect x="165" y="575" height="26" rx="6" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="179" y="593" fill="#a0a0a8" font-family="system-ui,sans-serif" font-size="12">Three.js</text>

    <rect x="248" y="575" height="26" rx="6" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="262" y="593" fill="#a0a0a8" font-family="system-ui,sans-serif" font-size="12">Python</text>

    <rect x="325" y="575" height="26" rx="6" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="339" y="593" fill="#a0a0a8" font-family="system-ui,sans-serif" font-size="12">Quart</text>

    <rect x="392" y="575" height="26" rx="6" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="406" y="593" fill="#a0a0a8" font-family="system-ui,sans-serif" font-size="12">TypeScript</text>

    <rect x="480" y="575" height="26" rx="6" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="494" y="593" fill="#a0a0a8" font-family="system-ui,sans-serif" font-size="12">Tailwind CSS</text>
  </g>

  <!-- ===== Right Side: Dashboard Mockup ===== -->
  <g transform="translate(640, 60)">
    <!-- Mockup window -->
    <rect x="0" y="0" width="560" height="520" rx="12" fill="#0c0c14" stroke="rgba(255,255,255,0.1)" stroke-width="1.5" filter="url(#glow)"/>
    <rect x="0" y="0" width="560" height="40" rx="12" fill="rgba(255,255,255,0.03)"/>
    <rect x="0" y="20" width="560" height="20" fill="rgba(255,255,255,0.03)"/>
    <!-- Window dots -->
    <circle cx="20" cy="20" r="5" fill="#ef4444"/>
    <circle cx="40" cy="20" r="5" fill="#f59e0b"/>
    <circle cx="60" cy="20" r="5" fill="#22c55e"/>

    <!-- Left sidebar -->
    <rect x="0" y="40" width="160" height="480" fill="rgba(255,255,255,0.02)"/>
    <!-- Sidebar items -->
    <rect x="12" y="60" width="136" height="8" rx="4" fill="#00a8ff" opacity="0.6"/>
    <rect x="12" y="80" width="100" height="8" rx="4" fill="rgba(255,255,255,0.06)"/>
    <rect x="12" y="100" width="120" height="8" rx="4" fill="rgba(255,255,255,0.06)"/>
    <rect x="12" y="120" width="90" height="8" rx="4" fill="rgba(255,255,255,0.06)"/>

    <!-- Panel widgets on the right -->
    <!-- Weather widget -->
    <rect x="180" y="60" width="175" height="90" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <text x="192" y="82" fill="#a0a0a8" font-family="system-ui,sans-serif" font-size="9">🌤 WEATHER</text>
    <text x="192" y="106" fill="#f0f0f0" font-family="system-ui,sans-serif" font-size="20" font-weight="300">24°C</text>
    <text x="192" y="124" fill="#a0a0a8" font-family="system-ui,sans-serif" font-size="10">Partly Cloudy • 62% humidity</text>
    <text x="192" y="140" fill="#606068" font-family="system-ui,sans-serif" font-size="9">Updated 1m ago via SSE</text>

    <!-- Trending widget -->
    <rect x="370" y="60" width="175" height="90" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <text x="382" y="82" fill="#a0a0a8" font-family="system-ui,sans-serif" font-size="9">💻 GITHUB TRENDING</text>
    <text x="382" y="106" fill="#f0f0f0" font-family="system-ui,sans-serif" font-size="10">opencode-ai/opencode</text>
    <text x="382" y="122" fill="#a0a0a8" font-family="system-ui,sans-serif" font-size="9">★ 8,432 stars today</text>
    <text x="382" y="140" fill="#606068" font-family="system-ui,sans-serif" font-size="9">Updated 5m ago via SSE</text>

    <!-- Stocks widget -->
    <rect x="180" y="165" width="175" height="90" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <text x="192" y="187" fill="#a0a0a8" font-family="system-ui,sans-serif" font-size="9">📈 STOCKS</text>
    <text x="192" y="211" fill="#22c55e" font-family="system-ui,sans-serif" font-size="12">AAPL ▲ 1.2%</text>
    <text x="192" y="227" fill="#f0f0f0" font-family="system-ui,sans-serif" font-size="10">$198.42</text>
    <text x="192" y="245" fill="#606068" font-family="system-ui,sans-serif" font-size="9">Updated 60s ago via SSE</text>

    <!-- Crypto widget -->
    <rect x="370" y="165" width="175" height="90" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <text x="382" y="187" fill="#a0a0a8" font-family="system-ui,sans-serif" font-size="9">₿ CRYPTO</text>
    <text x="382" y="211" fill="#f59e0b" font-family="system-ui,sans-serif" font-size="12">BTC ▲ 0.8%</text>
    <text x="382" y="227" fill="#f0f0f0" font-family="system-ui,sans-serif" font-size="10">$67,432</text>
    <text x="382" y="245" fill="#606068" font-family="system-ui,sans-serif" font-size="9">Updated 2m ago via SSE</text>

    <!-- AI Orb (stylized) -->
    <circle cx="425" cy="380" r="50" fill="rgba(0,168,255,0.06)" stroke="rgba(0,168,255,0.15)" stroke-width="1"/>
    <circle cx="425" cy="380" r="30" fill="rgba(0,168,255,0.1)"/>
    <circle cx="425" cy="380" r="16" fill="rgba(0,168,255,0.2)" filter="url(#orbGlow)"/>
    <circle cx="425" cy="380" r="8" fill="#00a8ff" filter="url(#glow)"/>

    <!-- Chat message bubbles -->
    <rect x="180" y="285" width="210" height="36" rx="10" fill="rgba(0,168,255,0.08)" stroke="rgba(0,168,255,0.1)" stroke-width="1"/>
    <text x="192" y="307" fill="#f0f0f0" font-family="system-ui,sans-serif" font-size="11">What's the weather like today?</text>

    <rect x="200" y="333" width="340" height="50" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <text x="212" y="353" fill="#a0a0a8" font-family="system-ui,sans-serif" font-size="11">Currently 24°C with partly cloudy skies.</text>
    <text x="212" y="370" fill="#a0a0a8" font-family="system-ui,sans-serif" font-size="11">Expect light rain this evening.</text>

    <!-- Chat input -->
    <rect x="180" y="420" width="360" height="32" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <text x="196" y="441" fill="#606068" font-family="system-ui,sans-serif" font-size="11">Ask Friday anything...</text>

    <!-- Response -->
    <rect x="180" y="463" width="360" height="22" rx="6" fill="rgba(245,158,11,0.04)" stroke="rgba(245,158,11,0.08)" stroke-width="1"/>
    <text x="196" y="479" fill="#f59e0b" font-family="system-ui,sans-serif" font-size="10">✨ Proactive suggestion: "Bitcoin crossed $67K — want an alert?"</text>
  </g>

  <!-- Bottom gradient fade -->
  <rect x="0" y="600" width="1280" height="40" fill="url(#bgGrad)" opacity="0.8"/>
</svg>